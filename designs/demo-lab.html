<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · Lab — 2143 Labs status</title>
<link rel="stylesheet" href="estate-core.css">
<style>
#stage{max-width:96rem;margin:0 auto;padding:1rem}
.head{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;align-items:baseline;margin:.3rem 0 .3rem}
.head h1{font-size:1.4rem;margin:0}.head span{color:var(--muted)}
.crumb{font-size:.85rem;color:var(--muted);margin:0 0 .4rem}
.crumb button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:1rem;align-items:start}
.view{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.cam{position:relative;transform-origin:0 0;transition:transform .4s ease}
/* The 2D isometric floor plan: carries no text. */
.floorplan{position:absolute;left:0;top:0;transform-origin:0 0;transform:matrix(.866,.5,-.866,.5,0,0);transition:transform .4s ease}
/* Zoomed in, the plan lies flat (top-down) so rows and tiles read as a straight floor plan. */
.floorplan.flat{transform:none}
.floorplan.flat .bld .front,.floorplan.flat .bld .frontr{display:none}
.ov{transition:opacity .15s ease}.ov.moving{opacity:0}
.street{position:absolute;background:repeating-linear-gradient(90deg,var(--panel) 0 18px,var(--code) 18px 36px);border:1px solid var(--line)}
.bld{position:absolute;border:2px solid var(--fg);background:var(--panel)}
.bld .front{position:absolute;left:0;right:0;bottom:-2px;height:0;box-shadow:0 10px 0 0 color-mix(in srgb,var(--fg) 45%,var(--bg))}
.bld .frontr{position:absolute;top:0;bottom:0;right:-2px;width:0;box-shadow:10px 0 0 0 color-mix(in srgb,var(--fg) 30%,var(--bg))}
.bld.planned,.room.planned{border-style:dashed;background:transparent;border-color:var(--line);color:var(--muted);opacity:.55}
.bld.planned .front,.bld.planned .frontr{display:none}
.room{position:absolute;border:1px solid var(--line);background:var(--bg);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.row{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.tile{position:absolute;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.tile.st{background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.tile.st.planned{background:transparent;border-style:dashed;opacity:.55}
.tile.svc{background:var(--panel)}
.rack{position:absolute;border:1px solid var(--fg);background:var(--panel);display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:3px}
.rack i{display:block;height:4px;border-radius:1px;background:var(--ok)}.rack i.w{background:var(--warn)}.rack i.b{background:var(--bad)}
.rack.s-unknown{background:repeating-linear-gradient(45deg,var(--bg) 0 4px,var(--panel) 4px 8px)}
.rack.s-degraded{border-color:var(--warn);border-width:2px}.rack.s-down{border-color:var(--bad);border-width:2px}
.cable{position:absolute;background:var(--fg);opacity:.7;contain:layout paint}
.cable.k-public{background:var(--accent);opacity:.9}
/* Site-to-site WireGuard (DO ⇄ home): dashed purple, labelled on the link. */
.cable.k-tunnel{background:repeating-linear-gradient(90deg,var(--info) 0 6px,transparent 6px 10px)}
.cable.k-tunnel.v{background:repeating-linear-gradient(180deg,var(--info) 0 6px,transparent 6px 10px)}
.cable.ts-link{display:none}.cable.ts-link.on{display:block;opacity:1}
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin:.2rem 0 .4rem}
.legend i{position:static;display:inline-block;width:1.8em;height:3px;vertical-align:middle;margin-right:.4em}
.legend i.kube{height:.8em;width:1.2em}
.cable.c-degraded{background:var(--warn)!important;opacity:1}.cable.c-down{background:var(--bad)!important;opacity:1}
.pkt{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--fg);will-change:transform}
.dim .rack:not(.on),.dim .tile:not(.on),.dim .cable:not(.on),.dim .pkt{opacity:.35}
/* Flat overlay: labels are untransformed buttons and the Tab order. */
.ov{position:absolute;inset:0;pointer-events:none}
.ov>*{pointer-events:auto}
.lb{position:absolute;transform-origin:0 0;transform:scale(var(--inv,1)) translate(-50%,-50%);font:inherit;font-size:.72rem;line-height:1.2;text-align:center;white-space:nowrap;
  border:1px solid var(--line);border-radius:5px;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--fg);padding:.05rem .3rem;cursor:pointer}
.lb b{font-weight:600}
.lb.bl{font-size:1.15rem;font-weight:800;letter-spacing:.01em;padding:.15rem .55rem;border-width:2px;border-color:var(--fg);background:var(--bg);box-shadow:3px 3px 0 color-mix(in srgb,var(--fg) 30%,var(--bg));z-index:2;transform:scale(var(--inv,1)) translate(-50%,-100%)}
.lb.planned{color:var(--muted);font-weight:400;border-color:var(--line)}
.lb.bl.planned{font-size:.85rem;font-weight:500;border-width:1px;box-shadow:none;background:color-mix(in srgb,var(--bg) 88%,transparent)}
.lb.rm{font-size:.72rem;color:var(--muted)}
.lb.rm b{color:var(--fg)}
.lb.s-down{border-color:var(--bad)}.lb.s-degraded{border-color:var(--warn)}
.lb.sign{font-weight:600}
.kube{position:absolute;border:1.5px solid var(--accent);border-radius:4px;background:color-mix(in srgb,var(--accent) 9%,transparent)}
.tile.st.vip{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.cable.k-vip{background:var(--accent);opacity:.9}
.cable.k-route{background:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 8px);opacity:.8}
.cable.k-route.v{background:repeating-linear-gradient(180deg,var(--accent) 0 4px,transparent 4px 8px)}
.lb.vip{font-weight:600;border-color:var(--accent);color:var(--fg)}
.lead{position:absolute;width:0;border-left:1px solid var(--muted);pointer-events:none}
.lead::before{content:"";position:absolute;left:-4px;top:-1px;border:4px solid transparent;border-bottom:6px solid var(--muted);border-top:0}
.ov.moving .lead{opacity:0}
.lb.kube-l{color:var(--accent);border-color:var(--accent)}
.net{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95em;color:var(--fg)}
.tile.st.ts{border:2px solid var(--info);border-radius:50%;background:color-mix(in srgb,var(--info) 18%,var(--bg))}
.room.ts-room{border-color:var(--info);border-style:dashed}
/* Exit nodes are purple triangles (Tailscale purple, like the tunnels). The triangle is a ::before so the tile box keeps its hover outline and selected glow. */
.tile.xn{border:0;background:none;border-radius:2px}
.tile.xn::before{content:"";position:absolute;inset:0;background:var(--info);clip-path:polygon(50% 6%,95% 92%,5% 92%)}
.lb.tip:not(.alarm){z-index:5;transform:scale(var(--inv,1)) translate(-50%,0);box-shadow:0 2px 6px color-mix(in srgb,var(--fg) 25%,transparent)}
.hot{cursor:pointer}.hot:hover{outline:2px solid var(--accent);outline-offset:1px}
.dn-room{border-color:color-mix(in srgb,var(--fg) 35%,var(--bg))}
.strip{position:absolute;border:1.5px dashed color-mix(in srgb,var(--fg) 40%,var(--bg));border-radius:6px;background:color-mix(in srgb,var(--fg) 3%,transparent)}
.tile.dn,.tile.svc{display:flex;align-items:center;justify-content:center;font:inherit;font-size:.62rem;background:var(--panel);overflow:hidden}
.tile.svc b{font-weight:600;letter-spacing:-.02em;white-space:nowrap;font-size:.92em}
.tile.dn b{font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.tile.dn.sm b{font-size:.86em}
.tile.dn.wg{box-shadow:inset 3px 0 0 var(--info)}
.lb .via{color:var(--muted);font-weight:400}
.lb.pn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.66rem;color:var(--fg);border-color:transparent;background:none;padding:0 .1rem}
.lb.pn b{font-weight:600}
.lb.dl-l{transform:scale(var(--inv,1)) translate(0,-50%);border-color:transparent;background:none;font-size:.68rem;color:var(--muted)}
.lb.dl-l b{color:var(--fg)}
.lb.sv-l b{color:var(--accent)}
.insp h3{font-size:.82rem;margin:.6rem 0 .2rem}
.lb.ts-l{transform:scale(var(--inv,1)) translate(0,-50%);border-color:transparent;background:none}
.lb.ts-l b{color:var(--info)}
.ts-strip{position:absolute;border:1.5px dashed var(--info);border-radius:6px;background:color-mix(in srgb,var(--info) 5%,transparent)}
.tile.dp{border:2px dashed var(--info);border-radius:3px;transform:rotate(45deg) scale(.8);background:color-mix(in srgb,var(--info) 12%,var(--bg))}
.tile.dp.s-down,.tile.dp.s-unknown{border-color:var(--bad);background:var(--panel)}
.tile.xn.s-down::before,.tile.xn.s-unknown::before{background:var(--bad)}
/* Provider identity colours. Chosen in OKLCH: one lightness per mode (ink L .45 light / .80 dark, tint L .95 / .28)
   so Home and DigitalOcean carry equal visual weight and differ only in hue; hues sit away from the status hues
   (ok/warn/bad/accent) so a building never reads as a state. ?scheme=map|slate|mono */
:root{--home-ink:#605612;--home-tint:#f3efd9;--do-ink:#006173;--do-tint:#d9f4fb}
:root[data-scheme=slate]{--home-ink:#833f27;--home-tint:#ffe7dd;--do-ink:#295b77;--do-tint:#e0f2fd}
:root[data-scheme=mono]{--home-ink:var(--fg);--home-tint:var(--bg);--do-ink:var(--fg);--do-tint:var(--bg)}
@media (prefers-color-scheme:dark){
  :root{--home-ink:#cabf7f;--home-tint:#2c2918;--do-ink:#7acce0;--do-tint:#172d32}
  :root[data-scheme=slate]{--home-ink:#f6a88d;--home-tint:#38231c;--do-ink:#92c6e5;--do-tint:#1d2b33}
  :root[data-scheme=mono]{--home-ink:var(--fg);--home-tint:var(--bg);--do-ink:var(--fg);--do-tint:var(--bg)}
}
.p-home{--ink:var(--home-ink);--tint:var(--home-tint)}.p-do{--ink:var(--do-ink);--tint:var(--do-tint)}
.bld.p-home:not(.planned),.bld.p-do:not(.planned){border-color:var(--ink)}
.bld.p-home .front,.bld.p-do .front{box-shadow:0 10px 0 0 color-mix(in srgb,var(--ink) 55%,var(--bg))}
.bld.p-home .frontr,.bld.p-do .frontr{box-shadow:10px 0 0 0 color-mix(in srgb,var(--ink) 35%,var(--bg))}
.lb.bl.p-home:not(.planned),.lb.bl.p-do:not(.planned){color:var(--ink);background:var(--tint);border-color:var(--ink);box-shadow:3px 3px 0 color-mix(in srgb,var(--ink) 35%,var(--bg))}
.head select{font:inherit;font-size:.8rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px}
.insp{position:sticky;top:3.2rem;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:.7rem .8rem;font-size:.85rem;max-height:calc(100vh - 4rem);overflow:auto}
.insp h2{font-size:1rem;margin:0 0 .3rem}
.insp .x{float:right;font:inherit;background:none;border:1px solid var(--line);border-radius:4px;color:var(--fg);cursor:pointer}
.insp table{width:100%;border-collapse:collapse;font-size:.78rem}.insp td{padding:.1rem .2rem;border-bottom:1px solid var(--line)}
.ub{display:grid;grid-template-columns:2.4rem 1fr 2.6rem;gap:.2rem .4rem;align-items:center;margin:.4rem 0}
.ub span{height:.45rem;background:var(--line);border-radius:2px;overflow:hidden}.ub i{display:block;height:100%;background:var(--ok)}.ub i.w{background:var(--warn)}.ub i.b{background:var(--bad)}
.pack{display:flex;height:1rem;border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:.3rem 0}
.pack i{border-right:1px solid var(--bg);background:color-mix(in srgb,var(--accent) 35%,var(--bg))}
.days{display:grid;grid-template-columns:repeat(90,1fr);gap:1px;height:1.2rem;margin:.3rem 0}
.days i{background:var(--ok)}.days i.m{background:var(--warn)}.days i.x{background:var(--bad)}
.moved{color:var(--info)}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}.insp{position:static;max-height:none}}
@media (prefers-reduced-motion:reduce){.cam,.floorplan{transition:none}.pkt{display:none}}
</style>
</head>
<body>
<div id="scenario-bar"></div>
<p id="notice" class="mode-notice" hidden></p>
<main id="stage" aria-describedby="plain-h">
  <div class="head"><h1>Lab</h1><span id="sum"></span><span id="ages"></span><label>Colours <select id="scheme"><option value="map">Map: earth / sea</option><option value="slate">Clay / slate</option><option value="mono">Mono</option></select></label></div>
  <p class="crumb" id="crumb"></p>
  <p class="legend"><span><i class="cable k-public"></i>Internet</span><span><i class="cable k-lan"></i>Local network</span><span><i class="cable k-tunnel"></i>Encrypted tunnel (WireGuard / Tailscale)</span><span><i class="kube"></i>k3s cluster</span></p>
  <div class="wrap">
    <div class="view" id="view"><div class="cam" id="cam"><div class="floorplan" id="fp" aria-hidden="true"></div><div class="ov" id="ov"></div></div></div>
    <aside class="insp" id="insp" aria-live="polite"><p>Each building is a provider, each room a region. Top row: ingress. Middle: racks (machines) and compute. Bottom: services. Select anything to inspect; Enter on a building zooms in; Esc steps back out.</p></aside>
  </div>
</main>
<section id="plain" class="plain" aria-labelledby="plain-h"><h2 id="plain-h">All data as tables</h2></section>
<noscript><p>This view needs JavaScript. <a href="live-normal.html">Plain status page</a>.</p></noscript>
<script type="module">
import { start, renderPlain, scenarioBar, mountModes, stateWord, fmtBytes, fmtPct, fmtMs, fmtAge, esc } from "./estate-core.js";

const $ = (s) => document.querySelector(s);
const stage = $("#stage"), plain = $("#plain"), fp = $("#fp"), ov = $("#ov"), cam = $("#cam"), insp = $("#insp");
const mode = mountModes({ stage, plain, notice: $("#notice") });
scenarioBar($("#scenario-bar"));
// Provider colour scheme, from ?scheme= (default map); the picker rewrites the URL so a link keeps it.
{
  const q = new URLSearchParams(location.search), pick = $("#scheme");
  const set = (v) => { v = ["map", "slate", "mono"].includes(v) ? v : "map"; document.documentElement.dataset.scheme = v; pick.value = v; };
  set(q.get("scheme"));
  pick.addEventListener("change", () => { set(pick.value); q.set("scheme", pick.value); history.replaceState(null, "", "?" + q); });
}
const provCls = (pid) => (pid === "home" ? " p-home" : pid === "do" ? " p-do" : "");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const sk = (s) => (["up", "degraded", "down"].includes(s) ? s : "unknown");
const grade = (p) => (p >= 90 ? "b" : p >= 75 ? "w" : "");
// Node network rates are bytes per second (rate(node_network_*_bytes_total[5m])).
const bps = (n) => (n == null ? "—" : fmtBytes(n) + "/s");
const net = (rx, tx) => `↓${bps(rx)} ↑${bps(tx)}`;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

// What a room holds, in words: WAN, machines and hostnames, clusters, droplets, edge nodes.
// Home address plan (RFC 1918, safe to publish): Verizon LAN, internal clients, Traefik VIP pool.
const SUBNET = { verizon: "192.168.0.0/24", lan: "192.168.5.0/24", vip: "192.168.6.0/24" }, VIP_IP = "192.168.6.6";
function roomSummary(e, st) {
  if (st.id === "isp-lan") return `<span class="net">${SUBNET.verizon}</span>`;
  if (st.id === "house") return `<span class="net">${SUBNET.lan}</span>`;
  return "";
}

const U = 24;                          // px per tile in floor-plan space
const SITE_ORDER = ["isp-lan", "house", "nyc1", "tor1", "ash", "do-edge"];
const ROW_H = 3, PAD = 1, GAP = 3;     // tiles
let est = null, built = "", sel = null, zoom = null, OX = 0, OY = 0;
const pos = new Map();                 // entity key -> {x,y} tile centre in floor-plan space
const els = new Map();                 // entity key -> floor-plan element
const lbs = new Map();                 // entity key -> overlay button
const cables = new Map();              // hop id -> {segs, pts, len, pkts}
const bbox = new Map();                // provider id -> {x,y,w,h}
const prevNode = new Map(), movedFrom = new Map();

// Zoomed out: isometric. Zoomed into a building: flat top-down (?flat=0 keeps iso when zoomed, for comparison).
const FLAT_ZOOM = new URLSearchParams(location.search).get("flat") !== "0";
// Tailscale exit nodes, from `tailscale exit-node list` on 2026-10-28. Offline nodes are not usable, so not listed.
// The estate feed has no tailnet data yet; status here is fixed until pite reports `tailscale status --json`.
// DERP relays, from `tailscale debug derp-map` + `tailscale netcheck` on 2026-10-28, and /derp/probe (both 200).
// Fixed until pite reports netcheck. `site` is the room it is drawn in; `at` is the station it runs behind.
// derp-r answers /derp/probe but not STUN, so clients cannot measure it: up, latency unmeasured.
const DERP = [
  { id: "embedded", name: "Embedded DERP", where: "headscale in the home k3s cluster, behind Traefik", site: "house", at: "traefik", state: "up", ms: 4.4 },
  { id: "derp-r", name: "derp-r", where: "DOKS, DigitalOcean nyc1", site: "nyc1", at: "doks", state: "up", note: "relays; STUN gets no reply, so latency is not measured" },
];
// Exit nodes; `site` set = it runs in that room, null = a third party (Mullvad), drawn in the Tailscale room.
const EXIT_NODES = [
  { id: "nas", name: "nas", where: "Home", site: "house", node: "nas", state: "up" },
  { id: "doks-us-nyc", name: "doks-us-nyc", where: "DOKS, DigitalOcean nyc1", site: "nyc1", at: "doks", state: "up" },
  // Mullvad exits are tailscale+gluetun pods in vpn-endpoints: `node` is the rack the pod runs on (pods move; this
  // is a kubectl sample from 2026-10-29). State is the tailnet's view, not the pod's: za is Running but headscale
  // answers its polls with 404 node not found, so it is not an exit node at all.
  { id: "mullvad-de", name: "Mullvad DE", where: "Düsseldorf", node: "nas", pod: "de-mullvad", state: "up" },
  { id: "mullvad-ee", name: "Mullvad EE", where: "Tallinn", node: "big", pod: "ee-mullvad", state: "up" },
  { id: "mullvad-jp", name: "Mullvad JP", where: "Tokyo", node: "arch", pod: "jp-mullvad", state: "up" },
  { id: "mullvad-za", name: "Mullvad ZA", where: "South Africa", node: "closet", pod: "za-mullvad", state: "down", note: "Pod is Running 2/2, but headscale no longer knows the node (PollNetMap 404 node not found). Re-enrol it." },
  { id: "mullvad-us", name: "Mullvad US", where: "mullvad-us-vpin-deccam", state: "up", note: "Advertised on the tailnet, but no pod in vpn-endpoints runs it; where it runs is unknown." },
];
// Direct (non-Traefik) services: the port each binds, and the interface that reaches it. The WAN rows are the
// router's dst-nat table plus the Verizon forwards (read-only `print`, 2026-10-29); the internal rows are the
// service inventory and the tunnel ACL. RFC 1918 and 10.99 only, so safe to publish.
// g 1 = port-forwarded from the internet; g 2 = internal only (the LAN, plus WireGuard where wg is set).
const DIRECT = [
  // One tile per forwarded port, so each label stays narrow and sits under its own tile.
  { g: 1, id: "smtp", n: "Mail SMTP", p: "25", pr: "tcp", ip: "192.168.6.13", f: "25", note: "Stalwart" },
  { g: 1, id: "submission", n: "Mail submission", p: "587", pr: "tcp", ip: "192.168.6.13", f: "587", note: "Stalwart" },
  { g: 1, id: "imaps", n: "Mail IMAPS", p: "993", pr: "tcp", ip: "192.168.6.13", f: "993", note: "Stalwart" },
  { g: 1, id: "coturn", n: "Steam lobby TURN", p: "3478", pr: "tcp+udp", ip: "192.168.6.14", f: "3478 tcp+udp" },
  { g: 1, id: "coturn-relay", n: "TURN relay range", p: "45000-63", pr: "udp", ip: "192.168.6.14", f: "45000-45063 udp" },
  { g: 1, id: "ts-voice", n: "TeamSpeak voice", p: "9987", pr: "udp", ip: "192.168.6.15", f: "9987" },
  { g: 1, id: "ts-files", n: "TeamSpeak files", p: "30033", pr: "tcp", ip: "192.168.6.16", f: "30033" },
  { g: 1, id: "openrct2", n: "OpenRCT2", p: "11753", pr: "tcp", ip: "192.168.6.17", f: "11753" },
  { g: 1, id: "stun", n: "headscale STUN", p: "3479", pr: "udp", ip: "192.168.6.18", f: "3479", note: "externalTrafficPolicy: Local" },
  { g: 1, id: "livekit", n: "LiveKit signal", p: "7881", pr: "tcp", ip: "192.168.6.22", f: "7881" },
  { g: 1, id: "minecraft", n: "Minecraft", p: "25565", pr: "tcp", ip: "192.168.6.29", f: "25565" },
  { g: 1, id: "factorio", n: "Factorio", p: "34197", pr: "udp", ip: "192.168.6.28", f: "34197" },
  { g: 1, id: "monero", n: "Monero P2P", p: "18080", pr: "tcp", ip: "192.168.5.76", f: "18080", note: "bare metal, not in the cluster" },
  { g: 2, id: "postgres", n: "Postgres", p: "5432", pr: "tcp", ip: "192.168.5.36", wg: 1, note: "in-cluster, on closet" },
  { g: 2, id: "temporal", n: "Temporal gRPC", p: "7233", pr: "tcp", ip: "192.168.6.20", wg: 1 },
  { g: 2, id: "seaweed", n: "SeaweedFS S3", p: "8333", pr: "tcp", ip: "192.168.6.31", wg: 1, st: "s3" },
  { g: 2, id: "mimir", n: "Mimir", p: "8080", pr: "tcp", ip: "192.168.6.23", wg: 1 },

  }

// Label placement in overlay space. Drawn things (racks, tiles, the k3s platform) are obstacles. Buildings
// place first, then rooms and the Traefik row, then outside stations, then details.
// A label that names a drawn thing always sits under it, centred: first row straight below; if that is taken,
// the next row down, with an arrow from the label up to its thing. Other labels (buildings, rooms) try small
// steps around their anchor and take the lowest-cost spot. Labels never overlap each other.
function declutter() {
  // Everything here is computed from plan-space positions and the camera's target transform, not from
  // on-screen rects, so the result is the same whether or not a zoom animation is still running.
  const inv = parseFloat(cam.style.getPropertyValue("--inv")) || 1, G = 3 * inv;
  const m = /translate\(([-\d.e]+)px,\s*([-\d.e]+)px\)/.exec(cam.style.transform), tx = m ? +m[1] : 0, ty = m ? +m[2] : 0;
  const V = { x: -tx * inv, y: -ty * inv, w: $("#view").clientWidth * inv, h: $("#view").clientHeight * inv };
  // An obstacle is the projected box of a drawn thing; in iso a tile is a diamond, so its inner 60% stands in.
  const k = flat ? 1 : 0.6;
  const box = (x, y, w, h, kk = k) => {
    const cs = [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].map(([a, b]) => project(a, b));
    const x0 = Math.min(...cs.map((c) => c.x)), x1 = Math.max(...cs.map((c) => c.x)), y0 = Math.min(...cs.map((c) => c.y)), y1 = Math.max(...cs.map((c) => c.y));
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, bw = (x1 - x0) * kk, bh = (y1 - y0) * kk;
    return { x: cx - bw / 2, y: cy - bh / 2, w: bw, h: bh };
  };
  const obst = [...fp.querySelectorAll(".rack,.tile,.kube")].map((d) => box(parseFloat(d.style.left) / U, parseFloat(d.style.top) / U, parseFloat(d.style.width) / U, parseFloat(d.style.height) / U, d.classList.contains("kube") ? k * 0.85 : k));
  // Labels pinned under a drawn thing go before the free ones, so the free ones work around them.
  const rank = (l) => (l.classList.contains("bl") ? 0 : els.get(l.pk)?.style.width ? 1 : l.dataset.lvl === "rm" ? 2 : 3);
  const all = [...lbs.values()].filter((l) => l.bx != null && !l.hidden && !(l.classList.contains("tip") && !l.classList.contains("alarm")) && !l.classList.contains("ts-l") && !l.classList.contains("dl-l") && l.pk !== "room:direct").sort((a, b) => rank(a) - rank(b) || a.by - b.by || a.bx - b.bx);

  // Labels pinned under a thing ignore the k3s box: it is a container, its racks are what they name.
  const tiles = [...fp.querySelectorAll(".rack,.tile")].map((d) => box(parseFloat(d.style.left) / U, parseFloat(d.style.top) / U, parseFloat(d.style.width) / U, parseFloat(d.style.height) / U));
  const placed = [];
  // Pinned strip labels never move, so they are obstacles for the labels that do.
  for (const l of [...lbs.values()].filter((x) => x.bx != null && !x.hidden && x.classList.contains("dl-l")))
    placed.push({ x: l.bx, y: l.by - (l.offsetHeight * inv) / 2, w: l.offsetWidth * inv, h: l.offsetHeight * inv });
  ov.querySelectorAll(".lead").forEach((d) => d.remove());
  for (const l of all) {
    const w = l.offsetWidth * inv, h = l.offsetHeight * inv, bl = l.classList.contains("bl");
    const el = !bl && els.get(l.pk);
    if (el && el.style.width) {
      const o = box(parseFloat(el.style.left) / U, parseFloat(el.style.top) / U, parseFloat(el.style.width) / U, parseFloat(el.style.height) / U, 1);
      const cx = o.x + o.w / 2, top0 = o.y + o.h + G;
      let best = null, bestCost = Infinity, bestR = 0;
      for (let r = 0; r < 6; r++) for (const i of [0, -1, 1, -2, 2]) {
        const b = { x: cx - w / 2 + i * 0.3 * w, y: top0 + r * (h + G), w, h };
        if (placed.some((p) => cover(p, b) > 0)) continue;
        const cost = tiles.reduce((s, q) => s + cover(q, b), 0) * 4 + r * h * h * 0.6 + Math.abs(i) * h * h * 0.9;
        if (cost < bestCost) { best = b; bestCost = cost; bestR = r; }
      }
      best = best || { x: cx - w / 2, y: top0, w, h };
      l.style.left = best.x + w / 2 + "px"; l.style.top = best.y + h / 2 + "px";
      placed.push(best);
      // Not straight under its thing: an arrow from the label's top edge up to the thing's bottom edge.
      if (bestR > 0 || Math.abs(best.x + w / 2 - cx) > 1) {
        const lx = Math.min(Math.max(cx, best.x + 4 * inv), best.x + w - 4 * inv);
        const d = document.createElement("div"); d.className = "lead"; d.setAttribute("aria-hidden", "true");
        Object.assign(d.style, { left: lx + "px", top: o.y + o.h + "px", height: Math.max(0, best.y - o.y - o.h) + "px" });
        ov.prepend(d);
      }
      continue;
    }
    // Anchor box: building labels hang above their point, the rest are centred on it.
    const ax = l.bx - w / 2, ay = bl ? l.by - h : l.by - h / 2, sy = 0.55 * (h + G), sx = 0.25 * w + 8 * inv;
    // A label whose anchor is off-view (another building, when zoomed) is not pulled into view.
    const inView = outside({ x: l.bx, y: l.by, w: 0, h: 0 }) === 0;
    let best = null, bestCost = Infinity;
    for (let j = -8; j <= 8; j++) for (let i = -6; i <= 6; i++) {
      const b = { x: ax + i * sx, y: ay + j * sy, w, h };
      if (placed.some((p) => cover(p, b) > 0)) continue;
      const dist = Math.hypot(i * sx, j * sy * 1.6);
      const cost = obst.reduce((s, o) => s + cover(o, b), 0) * 4 + dist * h * 0.35 + (inView ? outside(b) * h * 40 : 0);
      if (cost < bestCost) { best = b; bestCost = cost; }
    }
    best = best || { x: ax, y: ay, w, h };
    l.style.left = best.x + w / 2 + "px";
    l.style.top = (bl ? best.y + h : best.y + h / 2) + "px";
    placed.push(best);
  }
}

  const c = est.components.find((x) => x.id === sel.id);
  els.get("c:" + c.id)?.classList.add("on");
  cables.get("svc:" + c.id)?.segs.forEach((s) => s.classList.add("on"));
  for (const hid of c.via) { const h = est.hops.find((x) => x.id === hid); cables.get(hid)?.segs.forEach((s) => s.classList.add("on")); els.get("st:" + h.from)?.classList.add("on"); els.get("st:" + h.to)?.classList.add("on"); }
}
// An exit node's physical way out: the rack its pod runs on, then that rack's site's hops to the internet.
function exitPath(x) {
  const n = x.node && est.nodes.find((y) => y.id === x.node);
  if (!n && !x.at) return { keys: [], hops: [], names: [], n: null };
  const keys = n ? ["n:" + n.id] : [], hops = [], names = n ? [n.name] : [];
  // Walk upstream to the internet: a home rack goes out via the router (<- verizon <- internet); a cloud
  // exit starts at its own station (doks <- DO load balancer <- internet).
  let at = n ? "router" : x.at;
  if (est.stations.some((s) => s.id === at)) {
    keys.push("st:" + at); names.push(est.stations.find((s) => s.id === at).name.split(" · ")[0]);
    for (let i = 0; i < 4; i++) {
      const h = est.hops.find((y) => y.to === at && y.kind !== "tunnel" && y.kind !== "probe");
      if (!h) break;
      hops.push(h.id); at = h.from; keys.push("st:" + at);
      const st = est.stations.find((s) => s.id === at); names.push(st ? st.name.split(" · ")[0] : at);
    }
  }
  return { keys, hops, names, n };
}
function inspect() {
  const e = est, hadX = document.activeElement?.classList.contains("x");
  let h = "";
  if (sel.t === "n") {
    const n = e.nodes.find((x) => x.id === sel.id); if (!n) return clearSel();
    const ws = e.workloads.filter((w) => w.node === n.id).sort((a, b) => b.ram_req_bytes - a.ram_req_bytes);
    const ub = (k, p) => `<span>${k}</span><span><i class="${grade(p)}" style="width:${p}%"></i></span><span>${fmtPct(p)}</span>`;
    h = `<h2>Rack ${esc(n.name)}</h2><p><span class="st st-${sk(n.state)}">${stateWord(n.state)}</span> · ${esc(n.role)} · ${n.arch}<br>${n.lan_ip ? esc(n.lan_ip) : "—"}${n.public_ip_locked ? ' <span class="chip locked">Sign in to reveal</span>' : ""}<br>${n.cpu_cores} cores · ${fmtBytes(n.ram_bytes)} · ${fmtBytes(n.disk_bytes)}<br>network ${net(n.net_rx_bps, n.net_tx_bps)}<br>reported ${n.age_s == null ? "not measured" : fmtAge(n.age_s)}</p>
      <div class="ub">${ub("cpu", n.cpu_pct)}${ub("ram", n.ram_pct)}${ub("disk", n.disk_pct)}</div>
      <p><strong>Tenants</strong> (RAM requests packed)</p><div class="pack">${ws.map((w) => `<i style="width:${((100 * w.ram_req_bytes) / n.ram_bytes).toFixed(2)}%" title="${esc(w.name)}"></i>`).join("")}</div>
      <table><tbody>${ws.map((w) => `<tr><td>${esc(w.name)}${movedFrom.has(w.id) ? ` <span class="moved">moved from ${esc(movedFrom.get(w.id).from)}</span>` : ""}</td><td>${fmtBytes(w.ram_req_bytes)} · ${w.ram_bytes == null ? "?" : fmtBytes(w.ram_bytes)}</td><td>${w.ready ? "ready" : "not ready"} · ${w.restarts}↻</td><td>${esc(w.version || "")}</td></tr>`).join("") || "<tr><td>No workloads</td></tr>"}</tbody></table>
      <p><a href="#row-node-${esc(n.id)}">Show in table</a></p>`;
  } else if (sel.t === "st") {
    const s = e.stations.find((x) => x.id === sel.id); if (!s) return clearSel();
    const hs = e.hops.filter((x) => x.from === s.id || x.to === s.id);
    const ids = new Set(hs.map((x) => x.id));
    h = `<h2>${esc(s.name)}</h2><p>${esc(s.kind)} · ${esc(s.site || "between buildings")} · ${s.tier}${s.planned ? " · planned" : ""}</p>${s.id === "tailnet" ? `<p>Control server <a href="https://net.2143.me">net.2143.me</a> is served by <b>Traefik</b> <span class="net">${VIP_IP}</span>. Tailnet clients reach Traefik directly for <span class="net">*.ts.2143.me</span>.</p><p>Out to the internet: clients connect peer to peer, through a DERP relay when they cannot. Relays: ${DERP.map((x) => `${esc(x.name)} <span class="st st-${sk(x.state)}">${stateWord(x.state)}</span>`).join(", ")}.</p>` : ""}
      <table><tbody>${hs.map((x) => `<tr><td>${x.from === s.id ? "→ " + esc(x.to) : "← " + esc(x.from)}</td><td>${esc(x.label)}</td><td>${fmtMs(x.latency_ms)}</td><td><span class="st st-${sk(x.state)}">${stateWord(x.state)}</span></td></tr>`).join("") || "<tr><td>No links yet</td></tr>"}</tbody></table>
      <p>Routes: ${e.components.filter((c) => c.via.some((v) => ids.has(v))).map((c) => esc(c.name)).join(", ") || "—"}</p>${hs[0] ? `<p><a href="#row-hop-${esc(hs[0].id)}">Show in table</a></p>` : ""}`;
    if (s.id === "router") h += `<h3>Port forwards</h3><p>Internet → Verizon forward → MikroTik WAN → dst-nat → target. Both hops are required; one alone fails silently.</p><table><tbody>${DIRECT.filter((d) => d.g === 1).map((d) => `<tr><td class="net">${esc(d.f)}</td><td><span class="net">${esc(d.ip)}</span>:${esc(d.p)}</td><td>${esc(d.n)}</td></tr>`).join("")}</tbody></table>`;
  } else if (sel.t === "dp") {
    const x = DERP.find((y) => y.id === sel.id);
    h = `<h2>DERP relay ${esc(x.name)}</h2><p><span class="st st-${sk(x.state)}">${stateWord(x.state)}</span>${x.ms ? " · " + fmtMs(x.ms) : ""}${x.note ? " · " + esc(x.note) : ""}</p><p>Runs on ${esc(x.where)}. Relays tailnet traffic when two devices cannot connect directly. Status is a fixed sample until pite reports <span class="net">tailscale netcheck</span>.</p>`;
  } else if (sel.t === "sv") {
    const d = DIRECT.find((y) => y.id === sel.id);
    const iface = d.g === 1 ? "the internet, through a port forward" : d.wg ? "the LAN, and the WireGuard tunnel" : "the LAN only";
    h = `<h2>${esc(d.n)}</h2><p>Listens on <span class="net">${esc(d.ip)}</span> · <span class="net">${esc(d.p)}</span>/${esc(d.pr)}. Reached over ${iface}. Not behind Traefik: no hostname, no certificate.</p>` +
      (d.g === 1 ? `<p>Path in: internet → Verizon CR1000B (forward <span class="net">${esc(d.f)}</span>) → MikroTik WAN → dst-nat → <span class="net">${esc(d.ip)}</span>.</p>` : "") +
      (d.wg ? `<p>The DigitalOcean cluster reaches it on <span class="net">wg-remote</span>: an explicit forward allow sits above the tunnel's default deny.</p>` : "") +
      (d.note ? `<p>${esc(d.note)}</p>` : "");
  } else if (sel.t === "x") {
    const x = EXIT_NODES.find((y) => y.id === sel.id);
    const ep = exitPath(x), st = ep.n && ep.n.state !== "up" ? ep.n.state : x.state;
    h = `<h2>Exit node ${esc(x.name)}</h2><p><span class="st st-${sk(st)}">${stateWord(st)}</span> · ${esc(x.where)}</p>` +
      (ep.names.length ? (ep.n ? `<p>${x.pod ? `Pod <span class="net">vpn-endpoints/${esc(x.pod)}</span> on rack` : "Runs on the rack itself:"} <b>${esc(ep.n.name)}</b> <span class="st st-${sk(ep.n.state)}">${stateWord(ep.n.state)}</span>.</p>` : "") +
        `<p>Physical path: ${ep.names[0] === x.name ? "" : `<b>${esc(x.name)}</b> ⇐ ${x.pod ? "WireGuard ⇐ " : ""}`}${ep.names.map((v, i) => (i || ep.names[0] !== x.name ? esc(v) : `<b>${esc(v)}</b>`)).join(" → ")}</p>`
        : `<p>Physical path unknown.</p>`) +
      (x.note ? `<p>${esc(x.note)}</p>` : "") + `<p>Status is a fixed sample until the tailnet is reported.</p>`;
  } else {
    const c = e.components.find((x) => x.id === sel.id);
    const outs = e.outages.filter((o) => o.id === c.id);
    h = `<h2>${esc(c.name)}</h2><p><span class="st st-${sk(c.state)}">${stateWord(c.state)}</span> · ${fmtMs(c.latency_ms)} · 30 d ${c.uptime["30d"]}%</p>
      <div class="days" aria-hidden="true">${c.daily_pct.map((p) => `<i class="${p < 99 ? "x" : p < 99.9 ? "m" : ""}"></i>`).join("")}</div>
      <p>Path: ${c.via.map((v) => esc(e.hops.find((x) => x.id === v)?.label || v)).join(" → ")}</p>
      <table><tbody>${outs.map((o) => `<tr><td>${new Date(o.start * 1000).toISOString().slice(0, 16).replace("T", " ")}</td><td>${o.end == null ? "ongoing" : Math.round((o.end - o.start) / 60) + " min"}</td></tr>`).join("") || "<tr><td>No outages in 90 days</td></tr>"}</tbody></table>
      <p><a href="#row-component-${esc(c.id)}">Show in table</a></p>`;
  }
  insp.innerHTML = `<button type="button" class="x" aria-label="Close">Esc</button>` + h;
  insp.querySelector(".x").addEventListener("click", clearSel);
  if (hadX) insp.querySelector(".x").focus();
}

addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape") return;
  if (sel) clearSel(); else if (zoom) { const z = zoom; zoomTo(null); lbs.get("b:" + z)?.focus({ preventScroll: true }); }
});
addEventListener("resize", () => est && fit());

// One rAF loop: packets ride the L-shaped cables (transform only).
let last = 0;
function frame(ts) {
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts;
  if (!reduce.matches && !stage.hidden) for (const cb of cables.values()) {
    if (!cb.pkts.length) continue;
    const [a, m, b] = cb.pts, l1 = Math.abs(m.x - a.x), L = l1 + Math.abs(b.y - m.y) || 1;
    for (const p of cb.pkts) {
      p.p = (p.p + dt * cb.speed) % 1;
      const d = p.p * L, x = d <= l1 ? a.x + Math.sign(m.x - a.x) * d : m.x, y = d <= l1 ? a.y : m.y + Math.sign(b.y - m.y) * (d - l1);
      p.style.transform = `translate(${(x * U).toFixed(1)}px, ${(y * U).toFixed(1)}px)`;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

start(update);
</script>
