name: spaces probe
on: workflow_dispatch
# Temporary: asks whether a plain S3 client can list the bucket with the same
# credentials OpenTofu uses. Never merged; deleted once the answer is known.
jobs:
  probe:
    runs-on: [self-hosted, nixos]
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      BAO_ADDR: https://openbao.ts.2143.me
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_REGION: nyc3
      AWS_DEFAULT_REGION: nyc3
    steps:
      - uses: actions/checkout@v7
      - name: tools
        run: |
          for p in $(nix build --no-link --print-out-paths nixpkgs#awscli2 nixpkgs#jq.bin); do
            echo "$p/bin" >> "$GITHUB_PATH"
          done
      - name: credentials from OpenBao
        run: sh infra/bao-env.sh
      - name: probe
        run: |
          set +e
          EP=https://nyc3.digitaloceanspaces.com
          q() { echo "### $1"; shift; "$@" 2>&1 | tail -6; echo; }
          q "aws version" aws --version
          q "list-objects-v2, no prefix" aws --endpoint-url "$EP" s3api list-objects-v2 --bucket 2143tf --max-keys 1
          q "list-objects-v2, prefix env:/" aws --endpoint-url "$EP" s3api list-objects-v2 --bucket 2143tf --max-keys 1 --prefix "env:/"
          q "list-objects-v2, prefix status/" aws --endpoint-url "$EP" s3api list-objects-v2 --bucket 2143tf --max-keys 1 --prefix "status/"
          q "list-objects (v1)" aws --endpoint-url "$EP" s3api list-objects --bucket 2143tf --max-keys 1
          q "head-bucket" aws --endpoint-url "$EP" s3api head-bucket --bucket 2143tf
          q "head-object state key" aws --endpoint-url "$EP" s3api head-object --bucket 2143tf --key status/terraform.tfstate
          q "put+get+delete a probe object" aws --endpoint-url "$EP" s3api put-object --bucket 2143tf --key status/.probe --body /etc/hostname
          q "get the probe object" aws --endpoint-url "$EP" s3api get-object --bucket 2143tf --key status/.probe /tmp/probe.out
          q "delete the probe object" aws --endpoint-url "$EP" s3api delete-object --bucket 2143tf --key status/.probe
          exit 0
