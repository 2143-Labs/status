# Namespace the page runs in. Previews get status-pr-<N>; the gallery uses status-design.
namespace: status-design

# Hostname served through shared-gateway's *.john2143.com listener.
# The wildcard certificate already covers it, so no certificate work is needed.
host: status.john2143.com

# Unique name for the HTTPRoute. It lives in `default` because Traefik
# ExtensionRef middlewares only resolve in the route's own namespace.
routeName: status-design

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Sidecars: `live` rebuilds /estate-live.json from status.json and the home
# Mimir; `games` rebuilds /games-live.json from Mimir, ROTS and GitHub. Both run
# this image.
live:
  image: python:3.14-alpine
  intervalSeconds: 30
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

games:
  intervalSeconds: 3
  # OpenBao key holding the read-only GitHub PAT. Empty = no ExternalSecret is
  # rendered, no token is mounted, and the page shows PR data as unavailable
  # (that is what every status-pr-<N> preview gets).
  githubKey: ""
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
