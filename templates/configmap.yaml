# Every designs/*.html and designs/*.json becomes a key in this ConfigMap,
# flattened to the file name so the pages are served at /map.html, /board.html,
# /sample-normal.json, ... No image build: Argo renders the chart from the PR's
# own commit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-design
  namespace: {{ .Values.namespace }}
  labels:
    app: status-design
data:
{{- range $path, $_ := .Files.Glob "designs/*.{html,json}" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
