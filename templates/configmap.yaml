# Every designs/*.html and designs/*.json becomes a key in this ConfigMap,
# flattened to the file name so the pages are served at /map.html, /board.html,
# /sample-normal.json, ... No image build: Argo renders the chart from the PR's
# own commit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-design
  namespace: {{ .Values.namespace }}
  labels:
    app: status-design
  annotations:
    # Client-side apply copies the whole object into a 256 KiB annotation, which
    # the sample data outgrows. Server-side apply keeps no such copy; the real
    # cap is then the 1 MiB ConfigMap limit.
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
{{- range $path, $_ := .Files.Glob "designs/*.{html,json}" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
