# The snapshot scripts, run by the deployment's `live` and `games` sidecars every
# live.intervalSeconds / games.intervalSeconds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-design-live
  namespace: {{ .Values.namespace }}
  labels:
    app: status-design
data:
  estate_snapshot.py: |
{{ .Files.Get "scripts/estate_snapshot.py" | indent 4 }}
  games_snapshot.py: |
{{ .Files.Get "scripts/games_snapshot.py" | indent 4 }}
