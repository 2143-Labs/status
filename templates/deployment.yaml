apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-design
  namespace: {{ .Values.namespace }}
  labels:
    app: status-design
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: status-design
  template:
    metadata:
      labels:
        app: status-design
      annotations:
        # Rolls the pod when any design changes; the ConfigMap name is stable.
        checksum/designs: {{ (.Files.Glob "designs/*.html").AsConfig | sha256sum | quote }}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: site
          configMap:
            name: status-design
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
