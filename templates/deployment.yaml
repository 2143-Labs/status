apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-design
  namespace: {{ .Values.namespace }}
  labels:
    app: status-design
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: status-design
  template:
    metadata:
      labels:
        app: status-design
      annotations:
        # Rolls the pod when any design changes; the ConfigMap name is stable.
        checksum/designs: {{ printf "%s%s%s" (.Files.Glob "designs/*.html").AsConfig (.Files.Get "files/nginx.conf") (.Files.Get "scripts/estate_snapshot.py") | sha256sum | quote }}
    spec:
      affinity:
        nodeAffinity:
          # workload-type=general selects the normal nodes. The hostname term is
          # temporary (2026-10-19): node big intermittently drops cross-node pod
          # traffic and in-pod DNS while reporting Ready. Remove it once fixed.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - big
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: live
              mountPath: /data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        # Rebuilds /estate-live.json from status.json and the home Mimir every
        # live.intervalSeconds. On failure the script logs one line and the old file stays.
        - name: live
          image: "{{ .Values.live.image }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          command: ["sh", "-c"]
          args:
            - |
              while :; do
                if python3 -B /app/scripts/estate_snapshot.py --live > /data/.estate-live.json.tmp; then
                  mv /data/.estate-live.json.tmp /data/estate-live.json
                fi
                sleep {{ .Values.live.intervalSeconds }}
              done
          volumeMounts:
            - name: live
              mountPath: /data
            - name: site
              mountPath: /app/designs
              readOnly: true
            - name: live-script
              mountPath: /app/scripts
              readOnly: true
          resources:
{{ toYaml .Values.live.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: live
          emptyDir: {}
        - name: live-script
          configMap:
            name: status-design-live
        - name: site
          configMap:
            name: status-design
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: status-design-nginx
            items:
              - key: nginx.conf
                path: nginx.conf
